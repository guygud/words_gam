<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор прогресса по зонам</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3344;
  --text: #e1e4ed;
  --text2: #8b90a0;
  --accent: #f0c040;
  --green: #4caf80;
  --yellow: #e0a020;
  --red: #e05555;
  --blue: #5588dd;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

.container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
header h1 { font-size: 1.5rem; font-weight: 700; }
.header-actions { display: flex; gap: 8px; }

.btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: var(--font);
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--border); border-color: var(--text2); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--yellow); }
.btn.success { background: var(--green); color: #111; border-color: var(--green); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #111; padding: 10px 24px;
  border-radius: var(--radius); font-weight: 600; font-size: 0.9rem;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
section h2 {
  font-size: 1.05rem;
  margin-bottom: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
section h2::before {
  content: '▸ ';
  display: inline-block;
  transition: transform 0.2s;
}
section h2.open::before { transform: rotate(90deg); }

.params-grid {
  display: grid;
  gap: 8px 16px;
}
.params-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.params-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.params-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.params-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
.params-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }

.field { display: flex; flex-direction: column; gap: 2px; }
.field label {
  font-size: 0.75rem;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.field input[type="number"],
.field select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-family: var(--mono);
  width: 100%;
}
.field input[type="number"]:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent);
}
input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

.field input[type="checkbox"] { width: auto; margin-right: 4px; }
.field .checkbox-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.85rem;
  padding: 4px 0;
}

.players-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.player-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.player-header {
  padding: 10px 12px;
  font-weight: 600;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--border);
}
.player-col:nth-child(1) .player-header { background: #1a2a1a; color: var(--green); }
.player-col:nth-child(2) .player-header { background: #1a2a2a; color: #5cc; }
.player-col:nth-child(3) .player-header { background: #2a2a1a; color: var(--yellow); }
.player-col:nth-child(4) .player-header { background: #2a1a1a; color: var(--red); }

.player-params { padding: 12px; display: flex; flex-direction: column; gap: 6px; }

.result-table-wrap { padding: 0 12px 12px; }
.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  font-family: var(--mono);
}
.result-table th, .result-table td {
  padding: 4px 6px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
.result-table th {
  font-size: 0.7rem;
  color: var(--text2);
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
}
.result-table th:first-child,
.result-table td:first-child { text-align: left; }
.result-table tr:last-child { font-weight: 700; }
.result-table tr:last-child td { border-top: 2px solid var(--border); border-bottom: none; }

.result-table td.fast { color: var(--green); }
.result-table td.medium { color: var(--yellow); }
.result-table td.slow { color: var(--red); }

.copy-btn-row {
  padding: 0 12px 12px;
  display: flex;
  gap: 6px;
}

.collapsible-content {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease;
}
.collapsible-content.open { max-height: 2000px; }

.summary-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.summary-card .days {
  font-size: 2rem;
  font-weight: 700;
  font-family: var(--mono);
}
.summary-card .label {
  font-size: 0.8rem;
  color: var(--text2);
  margin-top: 4px;
}
.summary-card:nth-child(1) .days { color: var(--green); }
.summary-card:nth-child(2) .days { color: #5cc; }
.summary-card:nth-child(3) .days { color: var(--yellow); }
.summary-card:nth-child(4) .days { color: var(--red); }

.back-link {
  color: var(--text2);
  text-decoration: none;
  font-size: 0.85rem;
}
.back-link:hover { color: var(--text); }

.result-table td.out-of-time {
  color: var(--text2);
  text-decoration: line-through;
  opacity: 0.5;
}

.progress-bar-wrap {
  margin: 8px 12px;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.chart-wrap {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 12px;
}
.chart-wrap h3 {
  font-size: 0.9rem;
  margin-bottom: 8px;
  color: var(--text2);
}
.chart-wrap canvas {
  width: 100%;
  height: 280px;
  display: block;
}

@media (max-width: 1100px) {
  .players-grid { grid-template-columns: repeat(2, 1fr); }
  .summary-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .summary-row { grid-template-columns: 1fr; }
  .charts-row { grid-template-columns: 1fr; }
  .params-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
  .params-grid.cols-5 { grid-template-columns: repeat(2, 1fr); }
  .params-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <a href="index.html" class="back-link">&larr; Все игры</a>
      <h1>Калькулятор прогресса: Курагочи</h1>
    </div>
    <div class="header-actions">
      <button class="btn primary" onclick="copyShareLink()">Скопировать ссылку</button>
      <button class="btn" onclick="resetDefaults()">Сбросить</button>
    </div>
  </header>

  <!-- Activation duration + simulation -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Симуляция</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-3">
        <div class="field">
          <label>Всего дней активации</label>
          <input type="number" data-key="actDays" value="90" min="1" step="1">
        </div>
        <div class="field">
          <label>Прогонов (Монте-Карло)</label>
          <input type="number" data-key="numRuns" value="1000" min="100" max="10000" step="100">
        </div>
        <div>
          <button class="btn primary" onclick="runSimulation()" style="margin-top:16px">Пересчитать</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Summary cards -->
  <div class="summary-row" id="summaryRow"></div>

  <!-- Charts -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Графики прогресса</h2>
    <div class="collapsible-content open">
      <div class="charts-row">
        <div class="chart-wrap">
          <h3>Комнаты (медиана)</h3>
          <canvas id="chartRooms"></canvas>
        </div>
        <div class="chart-wrap">
          <h3>Предметы (медиана)</h3>
          <canvas id="chartItems"></canvas>
        </div>
      </div>
      <div id="chartLegend" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:0.75rem;color:var(--text2)"></div>
    </div>
  </section>

  <!-- Global: Zones -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Стоимость зон (5 зон × 4 комнаты)</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-6" id="zoneParams"></div>
    </div>
  </section>

  <!-- Global: Energy -->
  <section>
    <h2 onclick="toggleSection(this)">Энергия по зонам</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-5" id="energyParams"></div>
    </div>
  </section>

  <!-- Global: Games -->
  <section>
    <h2 onclick="toggleSection(this)">Мини-игры</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="gameParams"></div>
    </div>
  </section>

  <!-- Global: Anchors -->
  <section>
    <h2 onclick="toggleSection(this)">Якоря</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="anchorParams"></div>
    </div>
  </section>

  <!-- Players -->
  <div class="players-grid" id="playersGrid"></div>

  <!-- Copy all -->
  <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
    <button class="btn" onclick="copyAllTables()">Скопировать все таблицы</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const ROOMS_PER_ZONE = 4;
const ITEMS_PER_ROOM = 5;

const ZONES = [
  { key: 'z0', name: 'Зона 1', cost: 200 },
  { key: 'z1', name: 'Зона 2', cost: 650 },
  { key: 'z2', name: 'Зона 3', cost: 1100 },
  { key: 'z3', name: 'Зона 4', cost: 1700 },
  { key: 'z4', name: 'Зона 5', cost: 2600 },
];

function buildRooms() {
  const rooms = [];
  ZONES.forEach((z, zi) => {
    const zoneCost = state[z.key] ?? z.cost;
    const roomCost = zoneCost / ROOMS_PER_ZONE;
    const itemCost = roomCost / ITEMS_PER_ROOM;
    for (let r = 0; r < ROOMS_PER_ZONE; r++) {
      rooms.push({
        zoneIndex: zi,
        zoneName: z.name,
        cost: roomCost,
        itemCosts: Array(ITEMS_PER_ROOM).fill(itemCost),
      });
    }
  });
  return rooms;
}

function buildItemCosts() {
  const costs = [];
  buildRooms().forEach(room => costs.push(...room.itemCosts));
  return costs;
}

const ENERGY_LEVELS = [
  { key: 'e0', label: 'Зона 1 (старт)', cap: 16, regenPerHour: 4.0 },
  { key: 'e1', label: 'Зона 2', cap: 20, regenPerHour: 5.0 },
  { key: 'e2', label: 'Зона 3', cap: 24, regenPerHour: 6.4 },
  { key: 'e3', label: 'Зона 4', cap: 28, regenPerHour: 8.0 },
  { key: 'e4', label: 'Зона 5 (конец)', cap: 32, regenPerHour: 10.67 },
];

const GAMES = [
  { key: 'gA', name: 'Пазл', energyCost: 4, reward: 20 },
  { key: 'gB', name: 'ОТК', energyCost: 4, reward: 20 },
  { key: 'gC', name: 'СловоЦвет', energyCost: 4, reward: 20 },
];

const ANCHOR_TYPES = [
  { key: 'aL', name: 'Лёгкий', energy: 4, rubPrice: 10 },
  { key: 'aM', name: 'Средний', energy: 8, rubPrice: 50 },
  { key: 'aH', name: 'Тяжёлый', energy: 16, rubPrice: 100 },
];

const PLAYERS = [
  {
    key: 'p0', name: 'Невовлеченный',
    daysPerWeek: 3, sessionsPerDay: 1, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 1.4 }],
    games: [0, 1, 2], subscription: false,
  },
  {
    key: 'p1', name: 'Вовлеченный',
    daysPerWeek: 4, sessionsPerDay: 2, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 3.5 }, { type: 1, count: 1.4 }],
    games: [0, 1, 2], subscription: false,
  },
  {
    key: 'p2', name: 'Вовлеченный + Смарт',
    daysPerWeek: 4, sessionsPerDay: 2, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 3.5 }, { type: 1, count: 1.4 }],
    games: [0, 1, 2], subscription: true,
  },
  {
    key: 'p3', name: 'Хардкор',
    daysPerWeek: 7, sessionsPerDay: 3, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 5 }, { type: 1, count: 2 }, { type: 2, count: 1 }],
    games: [0, 1, 2], subscription: true,
  },
];

// ─── State ─────────────────────────────────────────────────
let state = buildDefaultState();
let simCache = {};

function buildDefaultState() {
  const s = {};
  s.actDays = 90;
  s.numRuns = 1000;
  ZONES.forEach(z => s[z.key] = z.cost);
  ENERGY_LEVELS.forEach(e => { s[e.key + '_cap'] = e.cap; s[e.key + '_rph'] = e.regenPerHour; });
  GAMES.forEach(g => { s[g.key + '_cost'] = g.energyCost; s[g.key + '_reward'] = g.reward; });
  ANCHOR_TYPES.forEach(a => { s[a.key] = a.energy; s[a.key + '_rub'] = a.rubPrice; });
  PLAYERS.forEach(p => {
    s[p.key + '_days'] = p.daysPerWeek;
    s[p.key + '_sess'] = p.sessionsPerDay;
    s[p.key + '_start'] = p.startDay;
    s[p.key + '_sub'] = p.subscription ? 1 : 0;
    ANCHOR_TYPES.forEach((a, ai) => {
      const found = p.anchorsPerWeek.find(x => x.type === ai);
      s[p.key + '_' + a.key] = found ? found.count : 0;
    });
    GAMES.forEach((g, gi) => {
      s[p.key + '_' + g.key] = p.games.includes(gi) ? 1 : 0;
    });
  });
  return s;
}

// ─── URL Serialization ────────────────────────────────────
function stateToQuery() {
  const def = buildDefaultState();
  const parts = [];
  for (const k in def) {
    if (state[k] !== def[k]) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(state[k]));
  }
  return parts.length ? '?' + parts.join('&') : '';
}

function loadFromQuery() {
  const params = new URLSearchParams(location.search);
  for (const [k, v] of params) {
    if (k in state) state[k] = parseFloat(v);
  }
}

function updateURL() {
  history.replaceState(null, '', location.pathname + stateToQuery());
}

// ─── Monte Carlo Engine ───────────────────────────────────
function poissonSample(lambda) {
  if (lambda <= 0) return 0;
  let L = Math.exp(-lambda), k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function getEnergyLevel(zoneIndex) {
  return Math.min(zoneIndex, ENERGY_LEVELS.length - 1);
}

function spendEnergy(energyRef, selectedGames) {
  let earned = 0;
  while (true) {
    const g = selectedGames.find(x => x.cost > 0 && x.cost <= energyRef.v);
    if (!g) break;
    energyRef.v -= g.cost;
    earned += g.reward;
  }
  return { coins: earned };
}

function simulatePlayer(pKey) {
  const numRuns = state.numRuns || 1000;
  const actDays = state.actDays;
  const daysPerWeek = state[pKey + '_days'];
  const sess = state[pKey + '_sess'];
  const startDay = state[pKey + '_start'];
  const hasSub = state[pKey + '_sub'];
  const availableDays = Math.max(0, actDays - startDay);

  const anchors = ANCHOR_TYPES.map(a => ({
    perDay: (state[pKey + '_' + a.key] || 0) / 7,
    energy: state[a.key],
    rub: state[a.key + '_rub'],
  }));

  const selectedGames = [];
  GAMES.forEach(g => {
    if (state[pKey + '_' + g.key]) {
      selectedGames.push({ cost: state[g.key + '_cost'], reward: state[g.key + '_reward'] });
    }
  });
  selectedGames.sort((a, b) => (b.cost > 0 ? b.reward / b.cost : 0) - (a.cost > 0 ? a.reward / a.cost : 0));

  const itemCosts = buildItemCosts();
  const numItems = itemCosts.length;
  const numZones = ZONES.length;
  const numRooms = buildRooms().length;
  const allZoneDays = [];
  const allRubles = [];
  const allCoinsLeft = [];
  const allItemsByDay = [];
  const allRoomsByDay = [];

  for (let run = 0; run < numRuns; run++) {
    let energy = 0, coins = 0, rubles = 0, itemsPurchased = 0;
    const zoneDays = [];
    const weeksWithSub = new Set();
    const itemsByDay = [];
    const roomsByDay = [];

    for (let day = 0; day < actDays; day++) {
      const daysFromStart = Math.max(0, day - startDay);
      const roomsCompleted = Math.floor(itemsPurchased / ITEMS_PER_ROOM);
      const currentZone = Math.min(Math.floor(roomsCompleted / ROOMS_PER_ZONE), numZones - 1);
      const lvl = getEnergyLevel(currentZone);
      const cap = state[ENERGY_LEVELS[lvl].key + '_cap'];
      const rph = state[ENERGY_LEVELS[lvl].key + '_rph'];
      const playChance = Math.min(1, daysPerWeek / 7);
      const isPlayDay = day >= startDay && Math.random() < playChance;

      if (day >= startDay && !isPlayDay) {
        energy = Math.min(cap, energy + rph * 24);
      } else if (isPlayDay) {
        const weekNum = Math.floor(daysFromStart / 7);
        const base = Math.floor(sess);
        const frac = sess - base;
        const todaySess = Math.max(1, base + (Math.random() < frac ? 1 : 0));
        const hPerSess = 24 / todaySess;
        const e = { v: energy };

        for (let s = 0; s < todaySess; s++) {
          e.v = Math.min(cap, e.v + rph * hPerSess);
          const sp = spendEnergy(e, selectedGames);
          coins += sp.coins;
        }

        if (hasSub && !weeksWithSub.has(weekNum)) {
          e.v += 2 * cap;
          weeksWithSub.add(weekNum);
          const sp = spendEnergy(e, selectedGames);
          coins += sp.coins;
        }

        for (const a of anchors) {
          const n = poissonSample(a.perDay);
          for (let j = 0; j < n; j++) {
            e.v += a.energy;
            rubles += a.rub;
            const sp = spendEnergy(e, selectedGames);
            coins += sp.coins;
          }
        }

        energy = e.v;

        while (itemsPurchased < numItems && coins >= itemCosts[itemsPurchased]) {
          coins -= itemCosts[itemsPurchased];
          itemsPurchased++;
          const newZones = Math.floor(itemsPurchased / (ITEMS_PER_ROOM * ROOMS_PER_ZONE));
          if (newZones > zoneDays.length) {
            zoneDays.push(daysFromStart);
          }
        }
      }

      itemsByDay.push(itemsPurchased);
      roomsByDay.push(Math.floor(itemsPurchased / ITEMS_PER_ROOM));
    }

    while (zoneDays.length < numZones) zoneDays.push(Infinity);
    allZoneDays.push(zoneDays);
    allRubles.push(rubles);
    allCoinsLeft.push(coins);
    allItemsByDay.push(itemsByDay);
    allRoomsByDay.push(roomsByDay);
  }

  const chartData = buildChartData(allItemsByDay, allRoomsByDay, actDays);
  return aggregate(allZoneDays, allRubles, allCoinsLeft, numZones, availableDays, hasSub, chartData);
}

function buildChartData(allItemsByDay, allRoomsByDay, actDays) {
  const itemsMedian = [];
  const roomsMedian = [];
  const numRuns = allItemsByDay.length;
  for (let d = 0; d < actDays; d++) {
    const itemsSorted = allItemsByDay.map(r => r[d]).sort((a, b) => a - b);
    const roomsSorted = allRoomsByDay.map(r => r[d]).sort((a, b) => a - b);
    const medIdx = Math.min(Math.floor(numRuns * 0.5), numRuns - 1);
    itemsMedian.push(itemsSorted[medIdx] ?? 0);
    roomsMedian.push(roomsSorted[medIdx] ?? 0);
  }
  return { items: itemsMedian, rooms: roomsMedian, days: actDays };
}


function pct(arr, p) {
  const s = arr.filter(x => x < Infinity).sort((a, b) => a - b);
  if (s.length === 0) return Infinity;
  const i = Math.max(0, Math.ceil(p / 100 * s.length) - 1);
  return s[i];
}

function pctAll(arr, p) {
  const s = [...arr].sort((a, b) => a - b);
  if (s.length === 0) return 0;
  const i = Math.max(0, Math.ceil(p / 100 * s.length) - 1);
  return s[i];
}

function aggregate(allZoneDays, allRubles, allCoinsLeft, numZones, availableDays, hasSub, chartData) {
  const zones = [];
  for (let z = 0; z < numZones; z++) {
    const days = allZoneDays.map(r => r[z]);
    const finished = days.filter(d => d < Infinity);
    const rate = finished.length / days.length;
    zones.push({
      zone: ZONES[z].name,
      cost: state[ZONES[z].key],
      p10: pct(days, 10),
      median: pct(days, 50),
      p90: pct(days, 90),
      completionRate: rate,
      fitsInTime: pct(days, 50) <= availableDays,
    });
  }

  const totals = allZoneDays.map(r => r[numZones - 1]);

  return {
    zones,
    availableDays,
    totalP10: pct(totals, 10),
    totalMedian: pct(totals, 50),
    totalP90: pct(totals, 90),
    totalCompletionRate: totals.filter(d => d < Infinity).length / totals.length,
    rubMedian: pctAll(allRubles, 50),
    rubP10: pctAll(allRubles, 10),
    rubP90: pctAll(allRubles, 90),
    coinsLeftMedian: pctAll(allCoinsLeft, 50),
    coinsLeftP10: pctAll(allCoinsLeft, 10),
    coinsLeftP90: pctAll(allCoinsLeft, 90),
    hasSub,
    chartData,
  };
}

function runSimulation() {
  const t0 = performance.now();
  simCache = {};
  PLAYERS.forEach(p => { simCache[p.key] = simulatePlayer(p.key); });
  const elapsed = (performance.now() - t0).toFixed(0);
  renderResults();
  renderCharts();
  updateURL();
  showToast(`${state.numRuns} прогонов × ${PLAYERS.length} игрока за ${elapsed} мс`);
}

function fmtD(d) { return d === Infinity ? '∞' : d.toFixed(0); }

function renderResults() {
  const summaryRow = document.getElementById('summaryRow');
  const summaryCards = [];

  PLAYERS.forEach(p => {
    const sim = simCache[p.key];
    if (!sim) return;

    const tbody = document.querySelector(`#table_${p.key} tbody`);
    const { zones, availableDays, totalP10, totalMedian, totalP90, totalCompletionRate, rubMedian, rubP10, rubP90, coinsLeftMedian, coinsLeftP10, coinsLeftP90, hasSub } = sim;

    const zonesCompleted = zones.filter(z => z.fitsInTime).length;
    const progressPct = Math.min(100, (zonesCompleted / zones.length) * 100);

    const bar = document.getElementById('bar_' + p.key);
    if (bar) {
      bar.style.width = progressPct + '%';
      bar.style.background = progressPct >= 100 ? 'var(--green)' : progressPct >= 50 ? 'var(--yellow)' : 'var(--red)';
    }

    const totalCost = zones.reduce((s, z) => s + z.cost, 0);
    const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

    tbody.innerHTML = zones.map(z => {
      const dClass = !z.fitsInTime ? 'out-of-time' : z.median < 7 ? 'fast' : z.median < 21 ? 'medium' : 'slow';
      return `<tr>
        <td>${z.zone}</td>
        <td>${z.cost}</td>
        <td class="${dClass}" style="font-size:0.7rem">${fmtD(z.p10)}</td>
        <td class="${dClass}"><b>${fmtD(z.median)}</b></td>
        <td class="${dClass}" style="font-size:0.7rem">${fmtD(z.p90)}</td>
        <td></td>
      </tr>`;
    }).join('') + `<tr>
      <td>Итого</td>
      <td>${totalCost}</td>
      <td style="font-size:0.7rem">${fmtD(totalP10)}</td>
      <td><b>${fmtD(totalMedian)}</b></td>
      <td style="font-size:0.7rem">${fmtD(totalP90)}</td>
      <td><b>${fmtR(rubMedian)}₽</b></td>
    </tr><tr style="font-weight:normal;font-size:0.75rem;color:var(--text2)">
      <td>Остаток монет</td>
      <td></td>
      <td>${fmtR(coinsLeftP10)}</td>
      <td><b style="color:var(--accent)">${fmtR(coinsLeftMedian)}</b></td>
      <td>${fmtR(coinsLeftP90)}</td>
      <td></td>
    </tr>`;

    const startDay = state[p.key + '_start'];
    const startLabel = startDay > 0 ? `<br><span style="font-size:0.7rem">старт: день ${startDay}</span>` : '';
    const pctDone = (totalCompletionRate * 100).toFixed(0);
    const fitsLabel = totalMedian <= availableDays
      ? `<span style="font-size:0.7rem;color:var(--green)">${pctDone}% успевают</span>`
      : `<span style="font-size:0.7rem;color:var(--red)">${zonesCompleted}/${zones.length} зон (${pctDone}%)</span>`;
    const rangeLabel = `<span style="font-size:0.65rem;color:var(--text2)">${fmtD(totalP10)}–${fmtD(totalP90)} дн</span>`;
    const rubLabel = `<span style="font-size:0.7rem;color:var(--green)">${fmtR(rubMedian)}₽</span> <span style="font-size:0.6rem;color:var(--text2)">(${fmtR(rubP10)}–${fmtR(rubP90)})</span>`;
    const subLabel = hasSub
      ? `<br><span style="font-size:0.65rem;color:var(--accent)">Альфа-Смарт: +2 капа/нед</span>`
      : '';

    summaryCards.push(`<div class="summary-card">
      <div class="days">${fmtD(totalMedian)}</div>
      <div class="label">${p.name}${startLabel}<br>${fitsLabel}<br>${rangeLabel}<br>${rubLabel}${subLabel}</div>
    </div>`);
  });

  summaryRow.innerHTML = summaryCards.join('');
}

const CHART_COLORS = ['#4caf80', '#55cccc', '#e0a020', '#e05555'];

function renderCharts() {
  const roomsCanvas = document.getElementById('chartRooms');
  const itemsCanvas = document.getElementById('chartItems');
  if (!roomsCanvas || !itemsCanvas) return;

  const actDays = state.actDays || 90;
  const numRooms = buildRooms().length;
  const numItems = numRooms * ITEMS_PER_ROOM;

  function drawChart(canvas, yMax, yLabel, getData) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    const pad = { left: 46, right: 12, top: 12, bottom: 30 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    ctx.fillStyle = '#1a1d27';
    ctx.fillRect(0, 0, w, h);

    const gridRows = 4;
    for (let i = 0; i <= gridRows; i++) {
      const y = pad.top + (i / gridRows) * plotH;
      const val = Math.round(yMax * (1 - i / gridRows));
      ctx.strokeStyle = i === gridRows ? '#3a3d50' : '#2a2d3e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + plotW, y);
      ctx.stroke();
      ctx.fillStyle = '#6b7080';
      ctx.font = '10px system-ui,sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(val.toString(), pad.left - 5, y);
    }

    ctx.fillStyle = '#8b90a0';
    ctx.font = '10px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(yLabel, pad.left, pad.top - 2);

    const xTicks = Math.min(6, actDays);
    for (let i = 0; i <= xTicks; i++) {
      const day = Math.round((i / xTicks) * actDays);
      const x = pad.left + (i / xTicks) * plotW;
      ctx.strokeStyle = '#2a2d3e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, pad.top + plotH);
      ctx.stroke();
      ctx.fillStyle = '#6b7080';
      ctx.font = '10px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('д' + day, x, h - 6);
    }

    const hasData = PLAYERS.some(p => simCache[p.key]?.chartData);
    if (!hasData) {
      ctx.fillStyle = '#6b7080';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Нажмите «Пересчитать»', pad.left + plotW / 2, pad.top + plotH / 2);
      return;
    }

    PLAYERS.forEach((p, pi) => {
      const data = simCache[p.key]?.chartData?.[getData];
      if (!data || data.length === 0) return;
      ctx.strokeStyle = CHART_COLORS[pi];
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = pad.left + (i / Math.max(1, data.length - 1)) * plotW;
        const y = pad.top + plotH - Math.min(1, data[i] / yMax) * plotH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
  }

  drawChart(roomsCanvas, numRooms, 'комнаты', 'rooms');
  drawChart(itemsCanvas, numItems, 'предметы', 'items');

  const legEl = document.getElementById('chartLegend');
  if (legEl) {
    legEl.innerHTML = PLAYERS.map((p, pi) =>
      `<span style="color:${CHART_COLORS[pi]}">${p.name}</span>`
    ).join(' · ');
  }
}

// ─── Event Handling ───────────────────────────────────────
function setupListeners() {
  document.addEventListener('input', e => {
    const el = e.target;
    const key = el.dataset.key;
    if (!key) return;

    if (el.type === 'checkbox') {
      state[key] = el.checked ? 1 : 0;
    } else {
      state[key] = parseFloat(el.value) || 0;
    }

    renderGameRatios();
    renderEnergyFillTimes();
    updateURL();
  });
}

function toggleSection(h2) {
  h2.classList.toggle('open');
  const content = h2.nextElementSibling;
  content.classList.toggle('open');
}

// ─── Copy / Share ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyShareLink() {
  const url = location.origin + location.pathname + stateToQuery();
  navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована!'));
}

function buildTableHTML(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const sim = simCache[pKey];
  if (!sim) return '<table></table>';
  const { zones, availableDays, totalP10, totalMedian, totalP90, rubMedian, coinsLeftMedian } = sim;
  const totalCost = zones.reduce((s, z) => s + z.cost, 0);
  const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

  let html = `<table><thead><tr><th colspan="6" style="text-align:left">${p.name} (${availableDays} дней)</th></tr>`;
  html += '<tr><th>Зона</th><th>Стоимость</th><th>P10</th><th>Медиана</th><th>P90</th><th>₽</th></tr></thead><tbody>';
  zones.forEach(z => {
    const style = !z.fitsInTime ? ' style="color:#888"' : '';
    html += `<tr${style}><td>${z.zone}</td><td>${z.cost}</td>`;
    html += `<td>${fmtD(z.p10)}</td><td><b>${fmtD(z.median)}</b></td><td>${fmtD(z.p90)}</td><td></td></tr>`;
  });
  html += `<tr><td><b>Итого</b></td><td><b>${totalCost}</b></td>`;
  html += `<td><b>${fmtD(totalP10)}</b></td><td><b>${fmtD(totalMedian)}</b></td><td><b>${fmtD(totalP90)}</b></td>`;
  html += `<td><b>${fmtR(rubMedian)}₽</b></td></tr>`;
  html += `<tr><td>Остаток монет</td><td></td><td></td><td><b>${fmtR(coinsLeftMedian)}</b></td><td></td><td></td></tr>`;
  html += '</tbody></table>';
  return html;
}

function buildTableTSV(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const sim = simCache[pKey];
  if (!sim) return '';
  const { zones, availableDays, totalP10, totalMedian, totalP90, rubMedian, coinsLeftMedian } = sim;
  const totalCost = zones.reduce((s, z) => s + z.cost, 0);
  const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

  let tsv = `${p.name} (${availableDays} дней)\n`;
  tsv += 'Зона\tСтоимость\tP10\tМедиана\tP90\t₽\n';
  zones.forEach(z => {
    tsv += `${z.zone}\t${z.cost}\t${fmtD(z.p10)}\t${fmtD(z.median)}\t${fmtD(z.p90)}\t\n`;
  });
  tsv += `Итого\t${totalCost}\t${fmtD(totalP10)}\t${fmtD(totalMedian)}\t${fmtD(totalP90)}\t${fmtR(rubMedian)}₽\n`;
  tsv += `Остаток монет\t\t\t${fmtR(coinsLeftMedian)}\t\t\n`;
  return tsv;
}

async function copyTable(pKey) {
  const html = buildTableHTML(pKey);
  const tsv = buildTableTSV(pKey);
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([tsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Таблица скопирована!');
  } catch {
    await navigator.clipboard.writeText(tsv);
    showToast('Таблица скопирована (текст)');
  }
}

async function copyAllTables() {
  let allHtml = '', allTsv = '';
  PLAYERS.forEach(p => {
    allHtml += buildTableHTML(p.key) + '<br>';
    allTsv += buildTableTSV(p.key) + '\n';
  });
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([allHtml], { type: 'text/html' }),
        'text/plain': new Blob([allTsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Все таблицы скопированы!');
  } catch {
    await navigator.clipboard.writeText(allTsv);
    showToast('Все таблицы скопированы (текст)');
  }
}

function resetDefaults() {
  state = buildDefaultState();
  history.replaceState(null, '', location.pathname);
  renderAll();
  runSimulation();
}

// ─── Init ─────────────────────────────────────────────────
function renderAll() {
  renderZoneParams();
  renderEnergyParams();
  renderGameParams();
  renderAnchorParams();
  renderPlayers();
}

loadFromQuery();
renderAll();
setupListeners();
runSimulation();
</script>
