<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор прогресса по зонам</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3344;
  --text: #e1e4ed;
  --text2: #8b90a0;
  --accent: #f0c040;
  --green: #4caf80;
  --yellow: #e0a020;
  --red: #e05555;
  --blue: #5588dd;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

.container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
header h1 { font-size: 1.5rem; font-weight: 700; }
.header-actions { display: flex; gap: 8px; }

.btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: var(--font);
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--border); border-color: var(--text2); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--yellow); }
.btn.success { background: var(--green); color: #111; border-color: var(--green); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #111; padding: 10px 24px;
  border-radius: var(--radius); font-weight: 600; font-size: 0.9rem;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
section h2 {
  font-size: 1.05rem;
  margin-bottom: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
section h2::before {
  content: '▸ ';
  display: inline-block;
  transition: transform 0.2s;
}
section h2.open::before { transform: rotate(90deg); }

.params-grid {
  display: grid;
  gap: 8px 16px;
}
.params-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.params-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.params-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.params-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }

.field { display: flex; flex-direction: column; gap: 2px; }
.field label {
  font-size: 0.75rem;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.field input[type="number"],
.field select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-family: var(--mono);
  width: 100%;
}
.field input[type="number"]:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent);
}
input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

.field input[type="checkbox"] { width: auto; margin-right: 4px; }
.field .checkbox-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.85rem;
  padding: 4px 0;
}

.players-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.player-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.player-header {
  padding: 10px 12px;
  font-weight: 600;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--border);
}
.player-col:nth-child(1) .player-header { background: #1a2a1a; color: var(--green); }
.player-col:nth-child(2) .player-header { background: #1a2a2a; color: #5cc; }
.player-col:nth-child(3) .player-header { background: #2a2a1a; color: var(--yellow); }
.player-col:nth-child(4) .player-header { background: #2a1a1a; color: var(--red); }

.player-params { padding: 12px; display: flex; flex-direction: column; gap: 6px; }

.result-table-wrap { padding: 0 12px 12px; }
.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  font-family: var(--mono);
}
.result-table th, .result-table td {
  padding: 4px 6px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
.result-table th {
  font-size: 0.7rem;
  color: var(--text2);
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
}
.result-table th:first-child,
.result-table td:first-child { text-align: left; }
.result-table tr:last-child { font-weight: 700; }
.result-table tr:last-child td { border-top: 2px solid var(--border); border-bottom: none; }

.result-table td.fast { color: var(--green); }
.result-table td.medium { color: var(--yellow); }
.result-table td.slow { color: var(--red); }

.copy-btn-row {
  padding: 0 12px 12px;
  display: flex;
  gap: 6px;
}

.collapsible-content {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease;
}
.collapsible-content.open { max-height: 2000px; }

.summary-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.summary-card .days {
  font-size: 2rem;
  font-weight: 700;
  font-family: var(--mono);
}
.summary-card .label {
  font-size: 0.8rem;
  color: var(--text2);
  margin-top: 4px;
}
.summary-card:nth-child(1) .days { color: var(--green); }
.summary-card:nth-child(2) .days { color: #5cc; }
.summary-card:nth-child(3) .days { color: var(--yellow); }
.summary-card:nth-child(4) .days { color: var(--red); }

.back-link {
  color: var(--text2);
  text-decoration: none;
  font-size: 0.85rem;
}
.back-link:hover { color: var(--text); }

.result-table td.out-of-time {
  color: var(--text2);
  text-decoration: line-through;
  opacity: 0.5;
}

.progress-bar-wrap {
  margin: 8px 12px;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

@media (max-width: 1100px) {
  .players-grid { grid-template-columns: repeat(2, 1fr); }
  .summary-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .summary-row { grid-template-columns: 1fr; }
  .params-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
  .params-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <a href="index.html" class="back-link">&larr; Все игры</a>
      <h1>Калькулятор прогресса по зонам</h1>
    </div>
    <div class="header-actions">
      <button class="btn primary" onclick="copyShareLink()">Скопировать ссылку</button>
      <button class="btn" onclick="resetDefaults()">Сбросить</button>
    </div>
  </header>

  <!-- Activation duration + simulation -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Симуляция</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-3">
        <div class="field">
          <label>Всего дней активации</label>
          <input type="number" data-key="actDays" value="90" min="1" step="1">
        </div>
        <div class="field">
          <label>Прогонов (Монте-Карло)</label>
          <input type="number" data-key="numRuns" value="1000" min="100" max="10000" step="100">
        </div>
        <div>
          <button class="btn primary" onclick="runSimulation()" style="margin-top:16px">Пересчитать</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Summary cards -->
  <div class="summary-row" id="summaryRow"></div>

  <!-- Global: Zones -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Стоимость зон (монеты)</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-6" id="zoneParams"></div>
    </div>
  </section>

  <!-- Global: Energy -->
  <section>
    <h2 onclick="toggleSection(this)">Энергия по уровням</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="energyParams"></div>
    </div>
  </section>

  <!-- Global: Games -->
  <section>
    <h2 onclick="toggleSection(this)">Мини-игры</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="gameParams"></div>
    </div>
  </section>

  <!-- Global: Anchors -->
  <section>
    <h2 onclick="toggleSection(this)">Якоря (энергия за выполнение)</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-3" id="anchorParams"></div>
    </div>
  </section>

  <!-- Players -->
  <div class="players-grid" id="playersGrid"></div>

  <!-- Copy all -->
  <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
    <button class="btn" onclick="copyAllTables()">Скопировать все таблицы</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const ZONES = [
  { key: 'z0', name: 'Кресло', cost: 20 },
  { key: 'z1', name: 'Стена', cost: 512 },
  { key: 'z2', name: 'Стеллаж 1', cost: 1776 },
  { key: 'z3', name: 'Стеллаж 2', cost: 2414 },
  { key: 'z4', name: 'Стеллаж 3', cost: 2254 },
  { key: 'z5', name: 'Потолок', cost: 3150 },
];

const ENERGY_LEVELS = [
  { key: 'e0', label: 'Ур.1 (старт)', cap: 10, regenPerHour: 1.67 },
  { key: 'e1', label: 'Ур.2 (после Стелл.1)', cap: 12, regenPerHour: 2.0 },
  { key: 'e2', label: 'Ур.3 (после Стелл.2)', cap: 14, regenPerHour: 2.33 },
  { key: 'e3', label: 'Ур.4 (после Стелл.3)', cap: 16, regenPerHour: 2.67 },
];

const GAMES = [
  { key: 'gA', name: 'Игра A', energyCost: 4, reward: 20, rubPrice: 0 },
  { key: 'gB', name: 'Игра B', energyCost: 8, reward: 50, rubPrice: 0 },
  { key: 'gC', name: 'Слова (C)', energyCost: 1, reward: 6, rubPrice: 0 },
  { key: 'gD', name: 'PvP (D)', energyCost: 10, reward: 120, rubPrice: 10 },
];

const ANCHOR_TYPES = [
  { key: 'aL', name: 'Лёгкий', energy: 3, rubPrice: 10 },
  { key: 'aM', name: 'Средний', energy: 6, rubPrice: 50 },
  { key: 'aH', name: 'Тяжёлый', energy: 13, rubPrice: 100 },
];

const PLAYERS = [
  {
    key: 'p0', name: 'Обычный',
    daysPerWeek: 4, sessionsPerDay: 1.5, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 1.5 }],
    games: [0, 2], subscription: false,
  },
  {
    key: 'p1', name: 'Обычный + Подписка',
    daysPerWeek: 4, sessionsPerDay: 1.5, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 1.5 }],
    games: [0, 1, 2], subscription: true,
  },
  {
    key: 'p2', name: 'Фродер',
    daysPerWeek: 7, sessionsPerDay: 4, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 1 }],
    games: [0, 1, 2], subscription: false,
  },
  {
    key: 'p3', name: 'Вкладывается',
    daysPerWeek: 7, sessionsPerDay: 2.5, startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 2.5 }, { type: 1, count: 2 }, { type: 2, count: 1.5 }],
    games: [0, 1, 2, 3], subscription: true,
  },
];

// ─── State ─────────────────────────────────────────────────
let state = buildDefaultState();
let simCache = {};

function buildDefaultState() {
  const s = {};
  s.actDays = 90;
  s.numRuns = 1000;
  ZONES.forEach(z => s[z.key] = z.cost);
  ENERGY_LEVELS.forEach(e => { s[e.key + '_cap'] = e.cap; s[e.key + '_rph'] = e.regenPerHour; });
  GAMES.forEach(g => { s[g.key + '_cost'] = g.energyCost; s[g.key + '_reward'] = g.reward; s[g.key + '_rub'] = g.rubPrice; });
  ANCHOR_TYPES.forEach(a => { s[a.key] = a.energy; s[a.key + '_rub'] = a.rubPrice; });
  PLAYERS.forEach(p => {
    s[p.key + '_days'] = p.daysPerWeek;
    s[p.key + '_sess'] = p.sessionsPerDay;
    s[p.key + '_start'] = p.startDay;
    s[p.key + '_sub'] = p.subscription ? 1 : 0;
    s[p.key + '_subE'] = 10;
    ANCHOR_TYPES.forEach((a, ai) => {
      const found = p.anchorsPerWeek.find(x => x.type === ai);
      s[p.key + '_' + a.key] = found ? found.count : 0;
    });
    GAMES.forEach((g, gi) => {
      s[p.key + '_' + g.key] = p.games.includes(gi) ? 1 : 0;
    });
  });
  return s;
}

// ─── URL Serialization ────────────────────────────────────
function stateToQuery() {
  const def = buildDefaultState();
  const parts = [];
  for (const k in state) {
    if (state[k] !== def[k]) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(state[k]));
  }
  return parts.length ? '?' + parts.join('&') : '';
}

function loadFromQuery() {
  const params = new URLSearchParams(location.search);
  for (const [k, v] of params) {
    if (k in state) state[k] = parseFloat(v);
  }
}

function updateURL() {
  history.replaceState(null, '', location.pathname + stateToQuery());
}

// ─── Monte Carlo Engine ───────────────────────────────────
function getEnergyLevel(zoneIndex) {
  if (zoneIndex <= 2) return 0;
  if (zoneIndex === 3) return 1;
  if (zoneIndex === 4) return 2;
  return 3;
}

function spendEnergy(energyRef, selectedGames) {
  let earned = 0, rub = 0;
  for (const g of selectedGames) {
    while (energyRef.v >= g.cost) {
      energyRef.v -= g.cost;
      earned += g.reward;
      rub += g.rub;
    }
  }
  return { coins: earned, rub };
}

function simulatePlayer(pKey) {
  const numRuns = state.numRuns || 1000;
  const actDays = state.actDays;
  const daysPerWeek = state[pKey + '_days'];
  const sess = state[pKey + '_sess'];
  const startDay = state[pKey + '_start'];
  const hasSub = state[pKey + '_sub'];
  const subEnergy = state[pKey + '_subE'];
  const availableDays = Math.max(0, actDays - startDay);

  const anchors = ANCHOR_TYPES.map(a => ({
    chancePerDay: (state[pKey + '_' + a.key] || 0) / 7,
    energy: state[a.key],
    rub: state[a.key + '_rub'],
  }));

  const selectedGames = [];
  GAMES.forEach(g => {
    if (state[pKey + '_' + g.key]) {
      selectedGames.push({ cost: state[g.key + '_cost'], reward: state[g.key + '_reward'], rub: state[g.key + '_rub'] });
    }
  });
  selectedGames.sort((a, b) => (b.reward / b.cost) - (a.reward / a.cost));

  const zoneCosts = ZONES.map(z => state[z.key]);
  const numZones = zoneCosts.length;
  const allZoneDays = [];
  const allRubles = [];
  const allCoinsLeft = [];

  for (let run = 0; run < numRuns; run++) {
    let energy = 0, coins = 0, rubles = 0, currentZone = 0;
    const zoneDays = [];

    for (let day = 0; day < actDays; day++) {
      if (day < startDay) continue;

      const lvl = getEnergyLevel(currentZone);
      const cap = state[ENERGY_LEVELS[lvl].key + '_cap'];
      const rph = state[ENERGY_LEVELS[lvl].key + '_rph'];
      const playChance = Math.min(1, daysPerWeek / 7);
      const isPlayDay = Math.random() < playChance;

      if (!isPlayDay) {
        energy = Math.min(cap, energy + rph * 24);
        continue;
      }

      const todaySess = Math.max(1, Math.round(sess + (Math.random() - 0.5)));
      const hPerSess = 24 / todaySess;
      const e = { v: energy };

      for (let s = 0; s < todaySess; s++) {
        e.v = Math.min(cap, e.v + rph * hPerSess);
        const sp = spendEnergy(e, selectedGames);
        coins += sp.coins;
        rubles += sp.rub;
      }

      for (const a of anchors) {
        if (a.chancePerDay > 0 && Math.random() < a.chancePerDay) {
          e.v += a.energy;
          rubles += a.rub;
          const sp = spendEnergy(e, selectedGames);
          coins += sp.coins;
          rubles += sp.rub;
        }
      }

      if (hasSub) {
        e.v += subEnergy;
        const sp = spendEnergy(e, selectedGames);
        coins += sp.coins;
        rubles += sp.rub;
      }

      energy = e.v;

      while (currentZone < numZones && coins >= zoneCosts[currentZone]) {
        coins -= zoneCosts[currentZone];
        zoneDays.push(day - startDay);
        currentZone++;
      }
    }

    while (zoneDays.length < numZones) zoneDays.push(Infinity);
    allZoneDays.push(zoneDays);
    allRubles.push(rubles);
    allCoinsLeft.push(coins);
  }

  return aggregate(allZoneDays, allRubles, allCoinsLeft, numZones, availableDays);
}

function pct(arr, p) {
  const s = arr.filter(x => x < Infinity).sort((a, b) => a - b);
  if (s.length === 0) return Infinity;
  const i = Math.max(0, Math.ceil(p / 100 * s.length) - 1);
  return s[i];
}

function pctAll(arr, p) {
  const s = [...arr].sort((a, b) => a - b);
  if (s.length === 0) return 0;
  const i = Math.max(0, Math.ceil(p / 100 * s.length) - 1);
  return s[i];
}

function aggregate(allZoneDays, allRubles, allCoinsLeft, numZones, availableDays) {
  const zones = [];
  for (let z = 0; z < numZones; z++) {
    const days = allZoneDays.map(r => r[z]);
    const finished = days.filter(d => d < Infinity);
    const rate = finished.length / days.length;
    zones.push({
      zone: ZONES[z].name,
      cost: state[ZONES[z].key],
      p10: pct(days, 10),
      median: pct(days, 50),
      p90: pct(days, 90),
      completionRate: rate,
      fitsInTime: pct(days, 50) <= availableDays,
    });
  }

  const totals = allZoneDays.map(r => r[numZones - 1]);
  return {
    zones,
    availableDays,
    totalP10: pct(totals, 10),
    totalMedian: pct(totals, 50),
    totalP90: pct(totals, 90),
    totalCompletionRate: totals.filter(d => d < Infinity).length / totals.length,
    rubMedian: pctAll(allRubles, 50),
    rubP10: pctAll(allRubles, 10),
    rubP90: pctAll(allRubles, 90),
    coinsLeftMedian: pctAll(allCoinsLeft, 50),
    coinsLeftP10: pctAll(allCoinsLeft, 10),
    coinsLeftP90: pctAll(allCoinsLeft, 90),
  };
}

function runSimulation() {
  const t0 = performance.now();
  simCache = {};
  PLAYERS.forEach(p => { simCache[p.key] = simulatePlayer(p.key); });
  const elapsed = (performance.now() - t0).toFixed(0);
  renderResults();
  updateURL();
  showToast(`${state.numRuns} прогонов × ${PLAYERS.length} игрока за ${elapsed} мс`);
}

// ─── Rendering ────────────────────────────────────────────
function renderZoneParams() {
  const el = document.getElementById('zoneParams');
  el.innerHTML = ZONES.map(z =>
    `<div class="field">
      <label>${z.name}</label>
      <input type="number" data-key="${z.key}" value="${state[z.key]}" min="0" step="1">
    </div>`
  ).join('');
}

function renderEnergyParams() {
  const el = document.getElementById('energyParams');
  el.innerHTML = ENERGY_LEVELS.map(e =>
    `<div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.8rem;color:var(--text2)">${e.label}</span>
      <div class="field">
        <label>Кап</label>
        <input type="number" data-key="${e.key}_cap" value="${state[e.key + '_cap']}" min="1" step="1">
      </div>
      <div class="field">
        <label>Реген/час</label>
        <input type="number" data-key="${e.key}_rph" value="${state[e.key + '_rph']}" min="0" step="0.01">
      </div>
      <div style="font-size:0.7rem;color:var(--text2);font-family:var(--mono)">
        кап за ${state[e.key + '_rph'] > 0 ? (state[e.key + '_cap'] / state[e.key + '_rph']).toFixed(1) : '∞'}ч
      </div>
    </div>`
  ).join('');
}

function renderGameParams() {
  const el = document.getElementById('gameParams');
  el.innerHTML = GAMES.map(g =>
    `<div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.8rem;color:var(--text2)">${g.name}</span>
      <div class="field">
        <label>Стоимость (энергия)</label>
        <input type="number" data-key="${g.key}_cost" value="${state[g.key + '_cost']}" min="1" step="1">
      </div>
      <div class="field">
        <label>Награда (монеты)</label>
        <input type="number" data-key="${g.key}_reward" value="${state[g.key + '_reward']}" min="0" step="1">
      </div>
      <div class="field">
        <label>Цена (₽)</label>
        <input type="number" data-key="${g.key}_rub" value="${state[g.key + '_rub']}" min="0" step="1">
      </div>
      <div style="font-size:0.75rem;color:var(--text2);font-family:var(--mono)">
        ${(state[g.key + '_reward'] / state[g.key + '_cost']).toFixed(2)} м/э
      </div>
    </div>`
  ).join('');
}

function renderAnchorParams() {
  const el = document.getElementById('anchorParams');
  el.innerHTML = ANCHOR_TYPES.map(a =>
    `<div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.8rem;color:var(--text2)">${a.name}</span>
      <div class="field">
        <label>Энергия</label>
        <input type="number" data-key="${a.key}" value="${state[a.key]}" min="0" step="1">
      </div>
      <div class="field">
        <label>Выручка (₽)</label>
        <input type="number" data-key="${a.key}_rub" value="${state[a.key + '_rub']}" min="0" step="1">
      </div>
    </div>`
  ).join('');
}

function renderPlayers() {
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = PLAYERS.map(p => {
    const anchorsHTML = ANCHOR_TYPES.map(a =>
      `<div class="field">
        <label>${a.name} якорей/нед</label>
        <input type="number" data-key="${p.key}_${a.key}" value="${state[p.key + '_' + a.key]}" min="0" step="0.5">
      </div>`
    ).join('');

    const gamesHTML = GAMES.map(g => {
      const checked = state[p.key + '_' + g.key] ? 'checked' : '';
      return `<div class="field">
        <label class="checkbox-row">
          <input type="checkbox" data-key="${p.key}_${g.key}" ${checked}> ${g.name}
        </label>
      </div>`;
    }).join('');

    const subChecked = state[p.key + '_sub'] ? 'checked' : '';

    return `<div class="player-col">
      <div class="player-header">${p.name}</div>
      <div class="player-params">
        <div class="field">
          <label>Дней в неделю</label>
          <input type="number" data-key="${p.key}_days" value="${state[p.key + '_days']}" min="1" max="7" step="1">
        </div>
        <div class="field">
          <label>Сессий в день</label>
          <input type="number" data-key="${p.key}_sess" value="${state[p.key + '_sess']}" min="0.5" max="10" step="0.5">
        </div>
        <div class="field">
          <label>День подключения</label>
          <input type="number" data-key="${p.key}_start" value="${state[p.key + '_start']}" min="0" step="1">
        </div>
        ${anchorsHTML}
        <div style="font-size:0.75rem;color:var(--text2);margin-top:4px">Мини-игры:</div>
        ${gamesHTML}
        <div class="field">
          <label class="checkbox-row">
            <input type="checkbox" data-key="${p.key}_sub" ${subChecked}> Подписка
          </label>
        </div>
        <div class="field" id="${p.key}_subE_wrap" style="display:${state[p.key + '_sub'] ? 'flex' : 'none'}">
          <label>Подписка энергия/день</label>
          <input type="number" data-key="${p.key}_subE" value="${state[p.key + '_subE']}" min="0" step="1">
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar_${p.key}"></div>
      </div>
      <div class="result-table-wrap">
        <table class="result-table" id="table_${p.key}">
          <thead>
            <tr><th>Зона</th><th>Стоим.</th><th>P10</th><th>Медиана</th><th>P90</th><th>₽</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="copy-btn-row">
        <button class="btn" onclick="copyTable('${p.key}')">Скопировать</button>
      </div>
    </div>`;
  }).join('');
}

function fmtD(d) { return d === Infinity ? '∞' : d.toFixed(0); }

function renderResults() {
  const summaryRow = document.getElementById('summaryRow');
  const summaryCards = [];

  PLAYERS.forEach(p => {
    const sim = simCache[p.key];
    if (!sim) return;

    const tbody = document.querySelector(`#table_${p.key} tbody`);
    const { zones, availableDays, totalP10, totalMedian, totalP90, totalCompletionRate, rubMedian, rubP10, rubP90, coinsLeftMedian, coinsLeftP10, coinsLeftP90 } = sim;

    const zonesCompleted = zones.filter(z => z.fitsInTime).length;
    const progressPct = Math.min(100, (zonesCompleted / zones.length) * 100);

    const bar = document.getElementById('bar_' + p.key);
    if (bar) {
      bar.style.width = progressPct + '%';
      bar.style.background = progressPct >= 100 ? 'var(--green)' : progressPct >= 50 ? 'var(--yellow)' : 'var(--red)';
    }

    const totalCost = zones.reduce((s, z) => s + z.cost, 0);
    const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

    tbody.innerHTML = zones.map(z => {
      const dClass = !z.fitsInTime ? 'out-of-time' : z.median < 7 ? 'fast' : z.median < 21 ? 'medium' : 'slow';
      return `<tr>
        <td>${z.zone}</td>
        <td>${z.cost}</td>
        <td class="${dClass}" style="font-size:0.7rem">${fmtD(z.p10)}</td>
        <td class="${dClass}"><b>${fmtD(z.median)}</b></td>
        <td class="${dClass}" style="font-size:0.7rem">${fmtD(z.p90)}</td>
        <td></td>
      </tr>`;
    }).join('') + `<tr>
      <td>Итого</td>
      <td>${totalCost}</td>
      <td style="font-size:0.7rem">${fmtD(totalP10)}</td>
      <td><b>${fmtD(totalMedian)}</b></td>
      <td style="font-size:0.7rem">${fmtD(totalP90)}</td>
      <td><b>${fmtR(rubMedian)}₽</b></td>
    </tr><tr style="font-weight:normal;font-size:0.75rem;color:var(--text2)">
      <td>Остаток монет</td>
      <td></td>
      <td>${fmtR(coinsLeftP10)}</td>
      <td><b style="color:var(--accent)">${fmtR(coinsLeftMedian)}</b></td>
      <td>${fmtR(coinsLeftP90)}</td>
      <td></td>
    </tr>`;

    const startDay = state[p.key + '_start'];
    const startLabel = startDay > 0 ? `<br><span style="font-size:0.7rem">старт: день ${startDay}</span>` : '';
    const pctDone = (totalCompletionRate * 100).toFixed(0);
    const fitsLabel = totalMedian <= availableDays
      ? `<span style="font-size:0.7rem;color:var(--green)">${pctDone}% успевают</span>`
      : `<span style="font-size:0.7rem;color:var(--red)">${zonesCompleted}/${zones.length} зон (${pctDone}%)</span>`;
    const rangeLabel = `<span style="font-size:0.65rem;color:var(--text2)">${fmtD(totalP10)}–${fmtD(totalP90)} дн</span>`;
    const rubLabel = `<span style="font-size:0.7rem;color:var(--green)">${fmtR(rubMedian)}₽</span> <span style="font-size:0.6rem;color:var(--text2)">(${fmtR(rubP10)}–${fmtR(rubP90)})</span>`;

    summaryCards.push(`<div class="summary-card">
      <div class="days">${fmtD(totalMedian)}</div>
      <div class="label">${p.name}${startLabel}<br>${fitsLabel}<br>${rangeLabel}<br>${rubLabel}</div>
    </div>`);
  });

  summaryRow.innerHTML = summaryCards.join('');
}

function renderGameRatios() {
  document.querySelectorAll('#gameParams > div').forEach((div, i) => {
    const g = GAMES[i];
    const ratioEl = div.querySelector('div:last-child');
    if (ratioEl) ratioEl.textContent = (state[g.key + '_reward'] / state[g.key + '_cost']).toFixed(2) + ' м/э';
  });
}

function renderEnergyFillTimes() {
  document.querySelectorAll('#energyParams > div').forEach((div, i) => {
    const e = ENERGY_LEVELS[i];
    const infoEl = div.querySelector('div:last-child');
    const rph = state[e.key + '_rph'];
    const cap = state[e.key + '_cap'];
    if (infoEl) infoEl.textContent = `кап за ${rph > 0 ? (cap / rph).toFixed(1) : '∞'}ч`;
  });
}

// ─── Event Handling ───────────────────────────────────────
function setupListeners() {
  document.addEventListener('input', e => {
    const el = e.target;
    const key = el.dataset.key;
    if (!key) return;

    if (el.type === 'checkbox') {
      state[key] = el.checked ? 1 : 0;
      if (key.endsWith('_sub')) {
        const pKey = key.replace('_sub', '');
        const wrap = document.getElementById(pKey + '_subE_wrap');
        if (wrap) wrap.style.display = el.checked ? 'flex' : 'none';
      }
    } else {
      state[key] = parseFloat(el.value) || 0;
    }

    renderGameRatios();
    renderEnergyFillTimes();
    updateURL();
  });
}

// ─── Section Toggle ───────────────────────────────────────
function toggleSection(h2) {
  h2.classList.toggle('open');
  const content = h2.nextElementSibling;
  content.classList.toggle('open');
}

// ─── Copy / Share ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyShareLink() {
  const url = location.origin + location.pathname + stateToQuery();
  navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована!'));
}

function buildTableHTML(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const sim = simCache[pKey];
  if (!sim) return '<table></table>';
  const { zones, availableDays, totalP10, totalMedian, totalP90, rubMedian, coinsLeftMedian } = sim;
  const totalCost = zones.reduce((s, z) => s + z.cost, 0);
  const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

  let html = `<table><thead><tr><th colspan="6" style="text-align:left">${p.name} (${availableDays} дней)</th></tr>`;
  html += '<tr><th>Зона</th><th>Стоимость</th><th>P10</th><th>Медиана</th><th>P90</th><th>₽</th></tr></thead><tbody>';
  zones.forEach(z => {
    const style = !z.fitsInTime ? ' style="color:#888"' : '';
    html += `<tr${style}><td>${z.zone}</td><td>${z.cost}</td>`;
    html += `<td>${fmtD(z.p10)}</td><td><b>${fmtD(z.median)}</b></td><td>${fmtD(z.p90)}</td><td></td></tr>`;
  });
  html += `<tr><td><b>Итого</b></td><td><b>${totalCost}</b></td>`;
  html += `<td><b>${fmtD(totalP10)}</b></td><td><b>${fmtD(totalMedian)}</b></td><td><b>${fmtD(totalP90)}</b></td>`;
  html += `<td><b>${fmtR(rubMedian)}₽</b></td></tr>`;
  html += `<tr><td>Остаток монет</td><td></td><td></td><td><b>${fmtR(coinsLeftMedian)}</b></td><td></td><td></td></tr>`;
  html += '</tbody></table>';
  return html;
}

function buildTableTSV(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const sim = simCache[pKey];
  if (!sim) return '';
  const { zones, availableDays, totalP10, totalMedian, totalP90, rubMedian, coinsLeftMedian } = sim;
  const totalCost = zones.reduce((s, z) => s + z.cost, 0);
  const fmtR = v => v === Infinity ? '∞' : v.toFixed(0);

  let tsv = `${p.name} (${availableDays} дней)\n`;
  tsv += 'Зона\tСтоимость\tP10\tМедиана\tP90\t₽\n';
  zones.forEach(z => {
    tsv += `${z.zone}\t${z.cost}\t${fmtD(z.p10)}\t${fmtD(z.median)}\t${fmtD(z.p90)}\t\n`;
  });
  tsv += `Итого\t${totalCost}\t${fmtD(totalP10)}\t${fmtD(totalMedian)}\t${fmtD(totalP90)}\t${fmtR(rubMedian)}₽\n`;
  tsv += `Остаток монет\t\t\t${fmtR(coinsLeftMedian)}\t\t\n`;
  return tsv;
}

async function copyTable(pKey) {
  const html = buildTableHTML(pKey);
  const tsv = buildTableTSV(pKey);
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([tsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Таблица скопирована!');
  } catch {
    await navigator.clipboard.writeText(tsv);
    showToast('Таблица скопирована (текст)');
  }
}

async function copyAllTables() {
  let allHtml = '', allTsv = '';
  PLAYERS.forEach(p => {
    allHtml += buildTableHTML(p.key) + '<br>';
    allTsv += buildTableTSV(p.key) + '\n';
  });
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([allHtml], { type: 'text/html' }),
        'text/plain': new Blob([allTsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Все таблицы скопированы!');
  } catch {
    await navigator.clipboard.writeText(allTsv);
    showToast('Все таблицы скопированы (текст)');
  }
}

function resetDefaults() {
  state = buildDefaultState();
  history.replaceState(null, '', location.pathname);
  renderAll();
  runSimulation();
}

// ─── Init ─────────────────────────────────────────────────
function renderAll() {
  renderZoneParams();
  renderEnergyParams();
  renderGameParams();
  renderAnchorParams();
  renderPlayers();
}

loadFromQuery();
renderAll();
setupListeners();
runSimulation();
</script>
</body>
</html>
