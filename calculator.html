<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор прогресса по зонам</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3344;
  --text: #e1e4ed;
  --text2: #8b90a0;
  --accent: #f0c040;
  --green: #4caf80;
  --yellow: #e0a020;
  --red: #e05555;
  --blue: #5588dd;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

.container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
header h1 { font-size: 1.5rem; font-weight: 700; }
.header-actions { display: flex; gap: 8px; }

.btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: var(--font);
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--border); border-color: var(--text2); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--yellow); }
.btn.success { background: var(--green); color: #111; border-color: var(--green); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #111; padding: 10px 24px;
  border-radius: var(--radius); font-weight: 600; font-size: 0.9rem;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
section h2 {
  font-size: 1.05rem;
  margin-bottom: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
section h2::before {
  content: '▸ ';
  display: inline-block;
  transition: transform 0.2s;
}
section h2.open::before { transform: rotate(90deg); }

.params-grid {
  display: grid;
  gap: 8px 16px;
}
.params-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.params-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.params-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.params-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }

.field { display: flex; flex-direction: column; gap: 2px; }
.field label {
  font-size: 0.75rem;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.field input[type="number"],
.field select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-family: var(--mono);
  width: 100%;
}
.field input[type="number"]:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent);
}
input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

.field input[type="checkbox"] { width: auto; margin-right: 4px; }
.field .checkbox-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.85rem;
  padding: 4px 0;
}

.players-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.player-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.player-header {
  padding: 10px 12px;
  font-weight: 600;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--border);
}
.player-col:nth-child(1) .player-header { background: #1a2a1a; color: var(--green); }
.player-col:nth-child(2) .player-header { background: #2a2a1a; color: var(--yellow); }
.player-col:nth-child(3) .player-header { background: #2a1a1a; color: var(--red); }

.player-params { padding: 12px; display: flex; flex-direction: column; gap: 6px; }

.result-table-wrap { padding: 0 12px 12px; }
.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  font-family: var(--mono);
}
.result-table th, .result-table td {
  padding: 4px 6px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
.result-table th {
  font-size: 0.7rem;
  color: var(--text2);
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
}
.result-table th:first-child,
.result-table td:first-child { text-align: left; }
.result-table tr:last-child { font-weight: 700; }
.result-table tr:last-child td { border-top: 2px solid var(--border); border-bottom: none; }

.result-table td.fast { color: var(--green); }
.result-table td.medium { color: var(--yellow); }
.result-table td.slow { color: var(--red); }

.copy-btn-row {
  padding: 0 12px 12px;
  display: flex;
  gap: 6px;
}

.collapsible-content {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease;
}
.collapsible-content.open { max-height: 2000px; }

.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.summary-card .days {
  font-size: 2rem;
  font-weight: 700;
  font-family: var(--mono);
}
.summary-card .label {
  font-size: 0.8rem;
  color: var(--text2);
  margin-top: 4px;
}
.summary-card:nth-child(1) .days { color: var(--green); }
.summary-card:nth-child(2) .days { color: var(--yellow); }
.summary-card:nth-child(3) .days { color: var(--red); }

.back-link {
  color: var(--text2);
  text-decoration: none;
  font-size: 0.85rem;
}
.back-link:hover { color: var(--text); }

.result-table td.out-of-time {
  color: var(--text2);
  text-decoration: line-through;
  opacity: 0.5;
}

.progress-bar-wrap {
  margin: 8px 12px;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

@media (max-width: 1100px) {
  .players-grid { grid-template-columns: 1fr; }
  .summary-row { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 600px) {
  .summary-row { grid-template-columns: 1fr; }
  .params-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
  .params-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <a href="index.html" class="back-link">&larr; Все игры</a>
      <h1>Калькулятор прогресса по зонам</h1>
    </div>
    <div class="header-actions">
      <button class="btn primary" onclick="copyShareLink()">Скопировать ссылку</button>
      <button class="btn" onclick="resetDefaults()">Сбросить</button>
    </div>
  </header>

  <!-- Activation duration -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Длительность активации</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-3">
        <div class="field">
          <label>Всего дней активации</label>
          <input type="number" data-key="actDays" value="90" min="1" step="1">
        </div>
      </div>
    </div>
  </section>

  <!-- Summary cards -->
  <div class="summary-row" id="summaryRow"></div>

  <!-- Global: Zones -->
  <section>
    <h2 class="open" onclick="toggleSection(this)">Стоимость зон (монеты)</h2>
    <div class="collapsible-content open">
      <div class="params-grid cols-6" id="zoneParams"></div>
    </div>
  </section>

  <!-- Global: Energy -->
  <section>
    <h2 onclick="toggleSection(this)">Энергия по уровням</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="energyParams"></div>
    </div>
  </section>

  <!-- Global: Games -->
  <section>
    <h2 onclick="toggleSection(this)">Мини-игры</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-4" id="gameParams"></div>
    </div>
  </section>

  <!-- Global: Anchors -->
  <section>
    <h2 onclick="toggleSection(this)">Якоря (энергия за выполнение)</h2>
    <div class="collapsible-content">
      <div class="params-grid cols-3" id="anchorParams"></div>
    </div>
  </section>

  <!-- Players -->
  <div class="players-grid" id="playersGrid"></div>

  <!-- Copy all -->
  <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
    <button class="btn" onclick="copyAllTables()">Скопировать все таблицы</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const ZONES = [
  { key: 'z0', name: 'Кресло', cost: 20 },
  { key: 'z1', name: 'Стена', cost: 512 },
  { key: 'z2', name: 'Стеллаж 1', cost: 1776 },
  { key: 'z3', name: 'Стеллаж 2', cost: 2414 },
  { key: 'z4', name: 'Стеллаж 3', cost: 2254 },
  { key: 'z5', name: 'Потолок', cost: 3150 },
];

const ENERGY_LEVELS = [
  { key: 'e0', label: 'Ур.1 (старт)', cap: 24, regenPerDay: 6 },
  { key: 'e1', label: 'Ур.2 (после Стелл.1)', cap: 28, regenPerDay: 7.2 },
  { key: 'e2', label: 'Ур.3 (после Стелл.2)', cap: 32, regenPerDay: 8.4 },
  { key: 'e3', label: 'Ур.4 (после Стелл.3)', cap: 40, regenPerDay: 12 },
];

const GAMES = [
  { key: 'gA', name: 'Игра A', energyCost: 4, reward: 20 },
  { key: 'gB', name: 'Игра B', energyCost: 8, reward: 50 },
  { key: 'gC', name: 'Слова (C)', energyCost: 1, reward: 6 },
  { key: 'gD', name: 'PvP (D)', energyCost: 10, reward: 120 },
];

const ANCHOR_TYPES = [
  { key: 'aL', name: 'Лёгкий', energy: 3 },
  { key: 'aM', name: 'Средний', energy: 6 },
  { key: 'aH', name: 'Тяжёлый', energy: 13 },
];

const PLAYERS = [
  {
    key: 'p0', name: 'Обычный',
    daysPerWeek: 4,
    startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 1.5 }],
    games: [0, 1],
  },
  {
    key: 'p1', name: 'Фродер',
    daysPerWeek: 7,
    startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 2 }, { type: 1, count: 2 }],
    games: [3],
  },
  {
    key: 'p2', name: 'Вкладывается',
    daysPerWeek: 7,
    startDay: 0,
    anchorsPerWeek: [{ type: 0, count: 2 }, { type: 1, count: 2 }, { type: 2, count: 1 }],
    games: [3],
  },
];

// ─── State ─────────────────────────────────────────────────
let state = buildDefaultState();

function buildDefaultState() {
  const s = {};
  s.actDays = 90;
  ZONES.forEach(z => s[z.key] = z.cost);
  ENERGY_LEVELS.forEach(e => { s[e.key + '_cap'] = e.cap; s[e.key + '_rpd'] = e.regenPerDay; });
  GAMES.forEach(g => { s[g.key + '_cost'] = g.energyCost; s[g.key + '_reward'] = g.reward; });
  ANCHOR_TYPES.forEach(a => s[a.key] = a.energy);
  PLAYERS.forEach(p => {
    s[p.key + '_days'] = p.daysPerWeek;
    s[p.key + '_start'] = p.startDay;
    ANCHOR_TYPES.forEach((a, ai) => {
      const found = p.anchorsPerWeek.find(x => x.type === ai);
      s[p.key + '_' + a.key] = found ? found.count : 0;
    });
    GAMES.forEach((g, gi) => {
      s[p.key + '_' + g.key] = p.games.includes(gi) ? 1 : 0;
    });
  });
  return s;
}

// ─── URL Serialization ────────────────────────────────────
function stateToQuery() {
  const def = buildDefaultState();
  const parts = [];
  for (const k in state) {
    if (state[k] !== def[k]) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(state[k]));
  }
  return parts.length ? '?' + parts.join('&') : '';
}

function loadFromQuery() {
  const params = new URLSearchParams(location.search);
  for (const [k, v] of params) {
    if (k in state) state[k] = parseFloat(v);
  }
}

function updateURL() {
  const q = stateToQuery();
  const url = location.pathname + q;
  history.replaceState(null, '', url);
}

// ─── Calculation ──────────────────────────────────────────
function getEnergyLevel(zoneIndex) {
  if (zoneIndex <= 2) return 0;
  if (zoneIndex === 3) return 1;
  if (zoneIndex === 4) return 2;
  return 3;
}

function calcPlayer(pKey) {
  const daysPerWeek = state[pKey + '_days'];
  const startDay = state[pKey + '_start'];
  const activationDays = state.actDays;
  const availableDays = Math.max(0, activationDays - startDay);

  let anchorEnergyPerWeek = 0;
  ANCHOR_TYPES.forEach(a => {
    anchorEnergyPerWeek += state[pKey + '_' + a.key] * state[a.key];
  });

  const selectedGames = [];
  GAMES.forEach((g, gi) => {
    if (state[pKey + '_' + g.key]) {
      selectedGames.push({
        cost: state[g.key + '_cost'],
        reward: state[g.key + '_reward'],
        ratio: state[g.key + '_reward'] / state[g.key + '_cost'],
      });
    }
  });
  selectedGames.sort((a, b) => b.ratio - a.ratio);

  const rows = [];
  let cumDays = 0;

  ZONES.forEach((z, zi) => {
    const lvl = getEnergyLevel(zi);
    const el = ENERGY_LEVELS[lvl];
    const regenPerDay = state[el.key + '_rpd'];
    const zoneCost = state[z.key];

    const energyFromRegen = regenPerDay * daysPerWeek;
    const totalEnergyPerWeek = energyFromRegen + anchorEnergyPerWeek;

    let coinsPerWeek = 0;
    let remainingEnergy = totalEnergyPerWeek;
    for (const g of selectedGames) {
      if (remainingEnergy <= 0) break;
      const plays = Math.floor(remainingEnergy / g.cost);
      coinsPerWeek += plays * g.reward;
      remainingEnergy -= plays * g.cost;
    }

    const coinsPerDay = coinsPerWeek / 7;
    const daysForZone = coinsPerDay > 0 ? zoneCost / coinsPerDay : Infinity;
    cumDays += daysForZone;

    const fitsInTime = cumDays <= availableDays;

    rows.push({
      zone: z.name,
      cost: zoneCost,
      energyPerWeek: totalEnergyPerWeek,
      coinsPerDay: coinsPerDay,
      days: daysForZone,
      cumDays: cumDays,
      fitsInTime: fitsInTime,
    });
  });

  return { rows, availableDays };
}

// ─── Rendering ────────────────────────────────────────────
function renderZoneParams() {
  const el = document.getElementById('zoneParams');
  el.innerHTML = ZONES.map(z =>
    `<div class="field">
      <label>${z.name}</label>
      <input type="number" data-key="${z.key}" value="${state[z.key]}" min="0" step="1">
    </div>`
  ).join('');
}

function renderEnergyParams() {
  const el = document.getElementById('energyParams');
  el.innerHTML = ENERGY_LEVELS.map(e =>
    `<div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.8rem;color:var(--text2)">${e.label}</span>
      <div class="field">
        <label>Кап</label>
        <input type="number" data-key="${e.key}_cap" value="${state[e.key + '_cap']}" min="1" step="1">
      </div>
      <div class="field">
        <label>Реген/сутки</label>
        <input type="number" data-key="${e.key}_rpd" value="${state[e.key + '_rpd']}" min="0" step="0.1">
      </div>
    </div>`
  ).join('');
}

function renderGameParams() {
  const el = document.getElementById('gameParams');
  el.innerHTML = GAMES.map(g =>
    `<div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:0.8rem;color:var(--text2)">${g.name}</span>
      <div class="field">
        <label>Стоимость (энергия)</label>
        <input type="number" data-key="${g.key}_cost" value="${state[g.key + '_cost']}" min="1" step="1">
      </div>
      <div class="field">
        <label>Награда (монеты)</label>
        <input type="number" data-key="${g.key}_reward" value="${state[g.key + '_reward']}" min="0" step="1">
      </div>
      <div style="font-size:0.75rem;color:var(--text2);font-family:var(--mono)">
        ${(state[g.key + '_reward'] / state[g.key + '_cost']).toFixed(2)} м/э
      </div>
    </div>`
  ).join('');
}

function renderAnchorParams() {
  const el = document.getElementById('anchorParams');
  el.innerHTML = ANCHOR_TYPES.map(a =>
    `<div class="field">
      <label>${a.name} (энергия)</label>
      <input type="number" data-key="${a.key}" value="${state[a.key]}" min="0" step="1">
    </div>`
  ).join('');
}

function renderPlayers() {
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = PLAYERS.map((p, pi) => {
    const anchorsHTML = ANCHOR_TYPES.map(a =>
      `<div class="field">
        <label>${a.name} якорей/нед</label>
        <input type="number" data-key="${p.key}_${a.key}" value="${state[p.key + '_' + a.key]}" min="0" step="0.5">
      </div>`
    ).join('');

    const gamesHTML = GAMES.map(g => {
      const checked = state[p.key + '_' + g.key] ? 'checked' : '';
      return `<div class="field">
        <label class="checkbox-row">
          <input type="checkbox" data-key="${p.key}_${g.key}" ${checked}> ${g.name}
        </label>
      </div>`;
    }).join('');

    return `<div class="player-col">
      <div class="player-header">${p.name}</div>
      <div class="player-params">
        <div class="field">
          <label>Дней в неделю</label>
          <input type="number" data-key="${p.key}_days" value="${state[p.key + '_days']}" min="1" max="7" step="1">
        </div>
        <div class="field">
          <label>День подключения</label>
          <input type="number" data-key="${p.key}_start" value="${state[p.key + '_start']}" min="0" step="1">
        </div>
        ${anchorsHTML}
        <div style="font-size:0.75rem;color:var(--text2);margin-top:4px">Мини-игры:</div>
        ${gamesHTML}
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar_${p.key}"></div>
      </div>
      <div class="result-table-wrap">
        <table class="result-table" id="table_${p.key}">
          <thead>
            <tr><th>Зона</th><th>Стоим.</th><th>М/день</th><th>Дней</th><th>Всего</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="copy-btn-row">
        <button class="btn" onclick="copyTable('${p.key}')">Скопировать</button>
      </div>
    </div>`;
  }).join('');
}

function renderResults() {
  const summaryRow = document.getElementById('summaryRow');
  const summaryCards = [];
  const activationDays = state.actDays;

  PLAYERS.forEach((p, pi) => {
    const { rows, availableDays } = calcPlayer(p.key);
    const tbody = document.querySelector(`#table_${p.key} tbody`);
    const totalCost = rows.reduce((s, r) => s + r.cost, 0);
    const totalDays = rows[rows.length - 1].cumDays;
    const zonesCompleted = rows.filter(r => r.fitsInTime).length;
    const progressPct = Math.min(100, (zonesCompleted / rows.length) * 100);

    const bar = document.getElementById('bar_' + p.key);
    if (bar) {
      bar.style.width = progressPct + '%';
      bar.style.background = progressPct >= 100 ? 'var(--green)' : progressPct >= 50 ? 'var(--yellow)' : 'var(--red)';
    }

    tbody.innerHTML = rows.map(r => {
      const dClass = !r.fitsInTime ? 'out-of-time' : r.days < 7 ? 'fast' : r.days < 21 ? 'medium' : 'slow';
      return `<tr>
        <td>${r.zone}</td>
        <td>${r.cost}</td>
        <td>${r.coinsPerDay.toFixed(1)}</td>
        <td class="${dClass}">${r.days === Infinity ? '∞' : r.days.toFixed(1)}</td>
        <td class="${dClass}">${r.cumDays === Infinity ? '∞' : r.cumDays.toFixed(1)}</td>
      </tr>`;
    }).join('') + `<tr>
      <td>Итого</td>
      <td>${totalCost}</td>
      <td></td>
      <td>${zonesCompleted}/${rows.length} зон</td>
      <td>${totalDays === Infinity ? '∞' : totalDays.toFixed(1)}</td>
    </tr>`;

    const startDay = state[p.key + '_start'];
    const startLabel = startDay > 0 ? `<br><span style="font-size:0.7rem">старт: день ${startDay}</span>` : '';
    const fitsLabel = totalDays <= availableDays
      ? `<span style="font-size:0.7rem;color:var(--green)">успевает</span>`
      : `<span style="font-size:0.7rem;color:var(--red)">${zonesCompleted}/${rows.length} зон за ${availableDays}д</span>`;

    summaryCards.push(`<div class="summary-card">
      <div class="days">${totalDays === Infinity ? '∞' : totalDays.toFixed(0)}</div>
      <div class="label">${p.name}${startLabel}<br>${fitsLabel}</div>
    </div>`);
  });

  summaryRow.innerHTML = summaryCards.join('');
}

function renderGameRatios() {
  document.querySelectorAll('#gameParams > div').forEach((div, i) => {
    const g = GAMES[i];
    const ratioEl = div.querySelector('div:last-child');
    if (ratioEl) ratioEl.textContent = (state[g.key + '_reward'] / state[g.key + '_cost']).toFixed(2) + ' м/э';
  });
}

// ─── Event Handling ───────────────────────────────────────
function setupListeners() {
  document.addEventListener('input', e => {
    const el = e.target;
    const key = el.dataset.key;
    if (!key) return;

    if (el.type === 'checkbox') {
      state[key] = el.checked ? 1 : 0;
    } else {
      state[key] = parseFloat(el.value) || 0;
    }

    renderGameRatios();
    renderResults();
    updateURL();
  });
}

// ─── Section Toggle ───────────────────────────────────────
function toggleSection(h2) {
  h2.classList.toggle('open');
  const content = h2.nextElementSibling;
  content.classList.toggle('open');
}

// ─── Copy / Share ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyShareLink() {
  const url = location.origin + location.pathname + stateToQuery();
  navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована!'));
}

function buildTableHTML(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const { rows, availableDays } = calcPlayer(pKey);
  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  const totalDays = rows[rows.length - 1].cumDays;
  const zonesCompleted = rows.filter(r => r.fitsInTime).length;

  let html = `<table><thead><tr><th colspan="5" style="text-align:left">${p.name} (${availableDays} дней)</th></tr>`;
  html += '<tr><th>Зона</th><th>Стоимость</th><th>Монет/день</th><th>Дней</th><th>Всего дней</th></tr></thead><tbody>';
  rows.forEach(r => {
    const style = !r.fitsInTime ? ' style="color:#888"' : '';
    html += `<tr${style}><td>${r.zone}</td><td>${r.cost}</td><td>${r.coinsPerDay.toFixed(1)}</td>`;
    html += `<td>${r.days === Infinity ? '∞' : r.days.toFixed(1)}</td>`;
    html += `<td>${r.cumDays === Infinity ? '∞' : r.cumDays.toFixed(1)}</td></tr>`;
  });
  html += `<tr><td><b>Итого</b></td><td><b>${totalCost}</b></td><td></td><td><b>${zonesCompleted}/${rows.length}</b></td>`;
  html += `<td><b>${totalDays === Infinity ? '∞' : totalDays.toFixed(1)}</b></td></tr>`;
  html += '</tbody></table>';
  return html;
}

function buildTableTSV(pKey) {
  const p = PLAYERS.find(x => x.key === pKey);
  const { rows, availableDays } = calcPlayer(pKey);
  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  const totalDays = rows[rows.length - 1].cumDays;
  const zonesCompleted = rows.filter(r => r.fitsInTime).length;

  let tsv = `${p.name} (${availableDays} дней)\n`;
  tsv += 'Зона\tСтоимость\tМонет/день\tДней\tВсего дней\n';
  rows.forEach(r => {
    tsv += `${r.zone}\t${r.cost}\t${r.coinsPerDay.toFixed(1)}\t`;
    tsv += `${r.days === Infinity ? '∞' : r.days.toFixed(1)}\t`;
    tsv += `${r.cumDays === Infinity ? '∞' : r.cumDays.toFixed(1)}\n`;
  });
  tsv += `Итого\t${totalCost}\t\t${zonesCompleted}/${rows.length} зон\t${totalDays === Infinity ? '∞' : totalDays.toFixed(1)}\n`;
  return tsv;
}

async function copyTable(pKey) {
  const html = buildTableHTML(pKey);
  const tsv = buildTableTSV(pKey);
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([tsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Таблица скопирована!');
  } catch {
    await navigator.clipboard.writeText(tsv);
    showToast('Таблица скопирована (текст)');
  }
}

async function copyAllTables() {
  let allHtml = '';
  let allTsv = '';
  PLAYERS.forEach(p => {
    allHtml += buildTableHTML(p.key) + '<br>';
    allTsv += buildTableTSV(p.key) + '\n';
  });
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([allHtml], { type: 'text/html' }),
        'text/plain': new Blob([allTsv], { type: 'text/plain' }),
      })
    ]);
    showToast('Все таблицы скопированы!');
  } catch {
    await navigator.clipboard.writeText(allTsv);
    showToast('Все таблицы скопированы (текст)');
  }
}

function resetDefaults() {
  state = buildDefaultState();
  history.replaceState(null, '', location.pathname);
  renderAll();
}

// ─── Init ─────────────────────────────────────────────────
function renderAll() {
  renderZoneParams();
  renderEnergyParams();
  renderGameParams();
  renderAnchorParams();
  renderPlayers();
  renderResults();
}

loadFromQuery();
renderAll();
setupListeners();
</script>
</body>
</html>
